version: '3.8'
services:
  backend:
    build:
      context: ./backend
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - paygoat-net
    expose:
      - "3000"
    volumes:
      - backend_data:/usr/src/app

  frontend:
    build:
      context: ./frontend
    restart: always
    networks:
      - paygoat-net
    expose:
      - "80"
    volumes:
      - frontend_data:/usr/share/nginx/html

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - frontend
      - backend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - paygoat-net

volumes:
  backend_data:
  frontend_data:

networks:
  paygoat-net:
    driver: bridge
